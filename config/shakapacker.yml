# Note: You must restart bin/shakapacker-dev-server for changes to take effect
# This file contains the defaults used by shakapacker.

default: &default
  source_path: app/javascript

  # Relative to source_path. gobo keeps its entry points in app/javascript/packs.
  source_entry_path: packs

  # Pick up entry points in subdirectories of source_entry_path.
  nested_entries: true

  public_root_path: public
  public_output_path: packs
  cache_path: tmp/shakapacker
  webpack_compile_output: true

  # Extra paths webpack should look up modules in.
  # ['app/assets', 'engine/foo/app/assets']
  additional_paths: []

  # Reload manifest.json on all requests so we reload latest compiled packs
  cache_manifest: false

  # Select JavaScript transpiler to use: 'swc', 'babel', 'esbuild', or 'none'.
  # gobo uses Babel (see babel.config.js).
  javascript_transpiler: "babel"

  # Select assets bundler to use: 'webpack' or 'rspack'.
  assets_bundler: "webpack"

  # Raises an error if the shakapacker gem and npm package versions mismatch.
  ensure_consistent_versioning: true

  # 'digest' (SHA) or 'mtime' (modified timestamp) to decide freshness.
  compiler_strategy: digest

  # Always content-hash, not just in production.
  useContentHash: true

  static_assets_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .tiff
    - .ico
    - .svg
    - .eot
    - .otf
    - .ttf
    - .woff
    - .woff2

  extensions:
    - .mjs
    - .js
    - .sass
    - .scss
    - .css
    - .module.sass
    - .module.scss
    - .module.css
    - .png
    - .svg
    - .gif
    - .jpeg
    - .jpg

development:
  <<: *default
  compile: true
  compiler_strategy: mtime

  # Disable content hashes in development for faster builds.
  useContentHash: false

  # Reference: https://webpack.js.org/configuration/dev-server/
  dev_server:
    host: localhost
    port: 3035
    hmr: false
    inline_css: true
    client:
      overlay: true
    compress: true
    allowed_hosts: "auto"
    pretty: true

test:
  <<: *default
  compile: true

  # Compile test packs to a separate directory
  public_output_path: packs-test

production:
  <<: *default

  # Production depends on precompilation of packs prior to booting for performance.
  compile: false

  # Cache manifest.json for performance
  cache_manifest: true
