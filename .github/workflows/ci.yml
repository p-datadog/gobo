name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle exec rails db:test:prepare
      - run: bundle exec rspec

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck POSIX sh scripts
        run: |
          scripts="$(git ls-files | while IFS= read -r f; do
            if head -n 1 "$f" | grep -q '^#!/bin/sh$'; then printf '%s\n' "$f"; fi
          done)"
          if [ -z "$scripts" ]; then
            echo "No #!/bin/sh scripts found" >&2
            exit 1
          fi
          shellcheck -s sh $scripts
